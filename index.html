<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulangan Harian Biologi: Sistem Imun</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--bd:#d9deea;--ac:#3454d1;--ok:#17803d;--okb:#e3f6ea;--no:#c0392b;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--card:#1e2433;--tx:#e8ecf5;--mu:#9aa4b8;--bd:#333c52;--ac:#7c93ff;--ok:#5fd48a;--okb:#16372a;--no:#ff8b7d;--nob:#40201c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:0 0 14px}
h1{font-size:1.4rem;margin:0 0 6px}h2{font-size:1.1rem;margin:18px 0 8px}
.mu{color:var(--mu);font-size:.92rem}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 20px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin:7px 0;cursor:pointer}
.o input{margin-top:5px}.o.k{background:var(--okb);border-color:var(--ok)}.o.x{background:var(--nob);border-color:var(--no)}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--bg)}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu);margin-bottom:6px}
.ex{background:var(--bg);border-left:4px solid var(--ac);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:.95rem}
.big{font-size:3rem;font-weight:800;color:var(--ac);line-height:1}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.pb{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.h{display:none}.r{display:flex;gap:10px;flex-wrap:wrap}
@media print{.np{display:none}.c{break-inside:avoid}}
</style></head><body><div class="w" id="app"></div>
<script>
const T=(...r)=>'<div class="tw"><table>'+r.map((x,i)=>'<tr>'+x.map(c=>i?'<td>'+c+'</td>':'<th>'+c+'</th>').join('')+'</tr>').join('')+'</table></div>';
const Q=[
{t:'pg',c:'Rudi terinjak paku. Dua jam kemudian kakinya merah, bengkak, hangat, dan nyeri. Banyak neutrofil berkumpul di sekitar luka.',q:'Mekanisme yang menyebabkan kaki Rudi merah dan bengkak adalah ....',o:['limfosit B melepaskan antibodi sehingga pembuluh darah di sekitar luka menyempit','sel T sitotoksik merusak jaringan sehat sehingga cairan menumpuk di sekitar luka','sel mast melepaskan histamin sehingga pembuluh darah melebar dan kapiler lebih permeabel','trombosit membentuk benang fibrin sehingga aliran darah ke jaringan luka terhenti','sel plasma melepaskan interferon sehingga sel jaringan menyerap banyak cairan'],a:2,e:'Pada peradangan, sel mast melepas histamin: terjadi vasodilatasi dan permeabilitas kapiler naik sehingga plasma dan fagosit keluar ke jaringan.'},
{t:'pg',c:'Seorang perokok berat (45 th) sering batuk berdahak dan mudah terkena infeksi saluran napas. Silia epitel trakea rusak dan produksi lendir meningkat.',q:'Kerusakan tersebut melemahkan pertahanan nonspesifik karena ....',o:['antibodi IgA tidak dapat lagi dikeluarkan ke permukaan saluran napas','makrofag alveolus berubah menjadi sel plasma penghasil antibodi','sel T helper kehilangan kemampuan mengenali antigen mikroba','lisozim tidak lagi dihasilkan oleh kelenjar pada saluran napas','mikroba yang terperangkap lendir tidak dapat disapu keluar dari saluran napas'],a:4,e:'Silia dan lendir adalah penghalang nonspesifik yang menyapu mikroba keluar. Silia rusak membuat mikroba tertahan dan mudah menginfeksi.'},
{t:'pg',c:'Makrofag memfagositosis bakteri <i>Staphylococcus aureus</i>, mencernanya di lisosom, lalu menampilkan fragmen antigen bersama molekul MHC kelas II di permukaannya.',q:'Peran penampilan fragmen antigen tersebut dalam menghubungkan pertahanan nonspesifik dan spesifik adalah ....',o:['mengaktifkan sel NK agar melepaskan perforin ke dalam sel bakteri','dikenali sel T helper sehingga respons imun spesifik terpicu','diikat langsung oleh komplemen sehingga bakteri mengalami lisis','dikenali eritrosit sehingga bakteri diangkut menuju limpa','diubah oleh makrofag menjadi antibodi yang menetralkan bakteri'],a:1,e:'Makrofag adalah sel penyaji antigen (APC). Antigen pada MHC II dikenali sel T helper yang kemudian mengoordinasi respons spesifik.'},
{t:'pg',c:'Tikus disuntik antigen X pada hari ke-0 dan ke-28. Kadar antibodi spesifik diukur berkala.'+T(['Hari ke-',0,7,14,21,28,31,35,42],['Antibodi (unit/mL)',0,0,15,40,30,180,350,300]),q:'Pernyataan yang tepat tentang respons imun setelah suntikan kedua adalah ....',o:['lebih lambat karena sel memori harus dibentuk ulang dari awal','lebih rendah karena antibodi yang ada menghambat pembentukan antibodi baru','sama dengan respons pertama karena jumlah antigen yang disuntikkan sama','lebih cepat dan lebih tinggi karena sel memori mengenali antigen X','hanya melibatkan sel T karena antibodi tidak dibentuk kembali'],a:3,e:'Respons sekunder lebih cepat, lebih tinggi, dan lebih lama berkat sel memori (hari ke-31 sudah 180 unit/mL, sedangkan respons primer baru 15 unit/mL pada hari ke-14).'},
{t:'pg',c:'Budi dan Sinta sama-sama luka tusuk dan mendapat pencegahan tetanus.'+T(['Orang','Tindakan medis','Hasil pemantauan'],['Budi','Disuntik toksoid tetanus','Antibodi muncul setelah 10–14 hari dan bertahan bertahun-tahun'],['Sinta','Disuntik antitoksin tetanus dari donor','Antibodi langsung terdeteksi dan hilang dalam beberapa minggu']),q:'Jenis kekebalan yang diperoleh Budi dan Sinta secara berurutan adalah ....',o:['aktif buatan dan pasif buatan','pasif buatan dan aktif buatan','aktif alami dan pasif alami','pasif alami dan aktif buatan','aktif buatan dan aktif alami'],a:0,e:'Toksoid (vaksin) = aktif buatan, membentuk sel memori. Antibodi jadi dari donor = pasif buatan, sementara.'},
{t:'pg',c:'Bayi 3 bulan yang mendapat ASI eksklusif lebih jarang diare. ASI, terutama kolostrum, mengandung IgA sekretori dari ibu.',q:'Jenis kekebalan yang diperoleh bayi dari antibodi tersebut adalah ....',o:['aktif alami, karena bayi membentuk sendiri IgA setelah terpapar kuman','aktif buatan, karena IgA diperoleh melalui pemberian vaksin oral','pasif alami, karena antibodi diterima dari ibu tanpa produksi sendiri','pasif buatan, karena antibodi diberikan dalam bentuk serum medis','nonspesifik, karena IgA bekerja sama terhadap semua jenis patogen'],a:2,e:'Antibodi yang diterima dari ibu (melalui ASI atau plasenta) adalah kekebalan pasif alami; bayi tidak memproduksinya sendiri.'},
{t:'pg',c:'Pasien HIV dengan tuberkulosis paru dan sariawan jamur <i>Candida</i> menjalani terapi ARV.'+T(['Waktu','CD4 (sel/µL)','Viral load (kopi/mL)'],['Saat terdiagnosis','180','250.000'],['6 bulan ARV','350','&lt; 50'],['12 bulan ARV','520','&lt; 50']),q:'Penyebab pasien mudah mengalami infeksi oportunistik saat terdiagnosis dan dampak terapi ARV adalah ....',o:['sel B dihancurkan virus sehingga antibodi tidak terbentuk; ARV menambah jumlah sel B','eritrosit diserang virus sehingga oksigen berkurang; ARV mengganti eritrosit yang rusak','fagosit dilumpuhkan virus sehingga bakteri tidak dicerna; ARV langsung membunuh bakteri','sel NK berlipat ganda secara berlebihan; ARV mengurangi jumlah sel NK dalam darah','sel T helper (CD4) dirusak virus sehingga respons tidak terkoordinasi; ARV menekan virus dan CD4 pulih'],a:4,e:'HIV menginfeksi sel T helper CD4. CD4 rendah melemahkan koordinasi sel B dan T sitotoksik. ARV menekan replikasi virus sehingga CD4 pulih.'},
{t:'pg',c:'Rina bersin-bersin, hidung gatal dan berair setiap menyapu rumah berdebu. Dokter memberinya antihistamin dan gejala mereda.',q:'Alasan antihistamin dapat meredakan gejala tersebut adalah ....',o:['membunuh tungau debu penyebab alergi di saluran napas','menghalangi histamin berikatan dengan reseptornya pada sel target','menghancurkan IgE yang sudah beredar di dalam plasma darah','meningkatkan produksi IgG yang mengikat alergen debu','mencegah sel B membentuk sel memori terhadap debu secara permanen'],a:1,e:'Antihistamin menghalangi reseptor histamin sehingga gatal, bersin, dan hidung berair berkurang. Obat ini tidak menghilangkan alergen maupun IgE.'},
{t:'pg',c:'Perempuan 28 th mengalami ruam kupu-kupu di wajah, nyeri sendi, dan protein dalam urine. ANA dan anti-dsDNA positif. Diagnosis: lupus eritematosus sistemik (SLE).',q:'Gejala pada banyak organ tersebut terjadi karena ....',o:['bakteri menyebar melalui darah dan menyerang kulit, sendi, serta ginjal sekaligus','sel T sitotoksik hanya menyerang ginjal sehingga organ lain ikut terganggu','alergen menempel pada IgE di sel mast sehingga histamin menyebar ke seluruh tubuh','autoantibodi terhadap komponen sel membentuk kompleks imun yang memicu radang di banyak jaringan','kekurangan sel T helper membuat berbagai organ mudah terinfeksi kuman'],a:3,e:'SLE adalah penyakit autoimun sistemik: autoantibodi terhadap komponen inti sel membentuk kompleks imun yang mengendap dan memicu radang.'},
{t:'pg',c:'Pasien menerima transplantasi ginjal dari donor non-kerabat. Tiga minggu kemudian kreatinin naik dan biopsi menunjukkan banyak sel T di ginjal baru: penolakan akut.',q:'Penyebab utama penolakan tersebut adalah ....',o:['sel T resipien mengenali MHC donor sebagai antigen asing lalu menyerang sel ginjal','IgE resipien mengikat ginjal donor sehingga sel mast melepaskan histamin','sel T helper donor di dalam ginjal menyerang seluruh jaringan tubuh pasien','makrofag resipien tidak mampu memfagositosis sel ginjal donor yang mati','kadar komplemen resipien menurun sehingga ginjal donor tidak diterima'],a:0,e:'Sel T resipien mengenali molekul MHC donor yang berbeda sebagai asing sehingga terjadi penolakan; pasien diberi imunosupresan.'},
{t:'mc',c:'Vaksin HPV untuk siswi SD diberikan lebih dari satu dosis. Vaksin dibuat dari partikel mirip virus (<i>virus-like particle</i>) dari protein kapsid, tanpa materi genetik virus.',q:'Pernyataan yang tepat tentang cara kerja vaksin tersebut adalah ....',o:['Antigen vaksin merangsang pembentukan sel plasma dan sel memori','Vaksin berisi antibodi siap pakai yang langsung menetralkan virus','Dosis lanjutan memicu respons sekunder dengan antibodi lebih banyak','Vaksin menggantikan peran sel T helper dalam mengaktifkan sel B','Partikel tanpa materi genetik virus tidak dapat menyebabkan infeksi'],a:[0,2,4],e:'Vaksin berisi antigen (bukan antibodi) dan tetap memerlukan sel T helper. Dosis lanjutan menguatkan respons sekunder. VLP tidak punya materi genetik sehingga tidak menginfeksi.'},
{t:'mc',c:'Pada infeksi virus, sel T sitotoksik (CD8+) menghancurkan sel tubuh yang terinfeksi.',q:'Pernyataan yang benar tentang sel tersebut adalah ....',o:['Menghasilkan antibodi yang beredar bebas dalam plasma darah','Mengenali fragmen antigen virus yang ditampilkan molekul MHC kelas I','Berdiferensiasi menjadi sel plasma setelah diaktifkan sel T helper','Melepaskan perforin dan granzim sehingga sel target mengalami apoptosis','Mengikat virus bebas di cairan jaringan lalu menggumpalkannya'],a:[1,3],e:'Sel T sitotoksik mengenali antigen pada MHC I dan membunuh sel target dengan perforin dan granzim. Antibodi dihasilkan sel plasma (turunan sel B).'},
{t:'mc',c:'Dina (8 th) pernah DBD dua tahun lalu. Tahun ini ia terinfeksi lagi dengan gejala lebih berat (syok) oleh serotipe dengue yang berbeda (ada empat serotipe, DENV-1 sampai DENV-4).',q:'Berdasarkan konsep <i>antibody-dependent enhancement</i> (ADE), pernyataan yang benar adalah ....',o:['Antibodi dari infeksi pertama dapat mengikat serotipe baru tanpa menetralkannya secara efektif','Sel memori dari infeksi pertama selalu memberi perlindungan penuh terhadap semua serotipe','Kompleks virus-antibodi dapat memudahkan virus masuk ke sel fagosit sehingga virus bertambah banyak','Adanya empat serotipe memungkinkan seseorang terinfeksi dengue lebih dari satu kali','Antibodi tidak berperan sama sekali dalam perjalanan penyakit dengue'],a:[0,2,3],e:'Pada infeksi sekunder serotipe berbeda, antibodi lama dapat gagal menetralkan dan justru memudahkan virus masuk ke fagosit (ADE). Perlindungan silang tidak penuh.'},
{t:'mc',c:'Hasil serologi campak tiga anak di posyandu:'+T(['Anak','Kondisi','IgM','IgG'],['P','Demam tinggi dan ruam sejak 3 hari','Positif','Negatif'],['Q','Sehat, imunisasi MR lengkap','Negatif','Positif'],['R','Sehat, belum pernah diimunisasi/terinfeksi','Negatif','Negatif']),q:'Pernyataan yang sesuai dengan data tersebut adalah ....',o:['Anak P kemungkinan sedang mengalami infeksi baru dan berada pada respons primer','Anak Q memiliki antibodi hasil imunisasi sehingga terlindungi dari campak','Anak R sudah sembuh dari campak sehingga memiliki sel memori','IgG selalu muncul lebih dahulu daripada IgM pada respons primer','Anak Q akan mengalami demam dan ruam campak karena IgM negatif'],a:[0,1],e:'IgM menandakan infeksi baru (respons primer); IgG positif menandakan kekebalan (infeksi lampau atau imunisasi). Anak R belum memiliki kekebalan.'},
{t:'mc',c:'Seorang perempuan sesak napas, bentol seluruh tubuh, dan tekanan darah turun beberapa menit setelah disengat lebah. Setahun lalu ia pernah disengat dengan reaksi ringan. Dokter menyatakan anafilaksis dan menyuntikkan epinefrin.',q:'Pernyataan yang tepat tentang kondisi tersebut adalah ....',o:['Reaksi muncul pada paparan pertama alergen tanpa sensitisasi sebelumnya','Paparan ulang membuat alergen mengikat IgE pada sel mast sehingga histamin dilepas','Antibiotik menghentikan reaksi dengan menghancurkan molekul alergen','Epinefrin menyempitkan pembuluh darah dan melebarkan saluran napas','Antibodi IgG yang terbentuk pada reaksi ini memicu degranulasi sel mast'],a:[1,3],e:'Anafilaksis adalah hipersensitivitas tipe I diperantarai IgE dan butuh sensitisasi sebelumnya. Epinefrin: vasokonstriksi dan bronkodilatasi.'},
{t:'bs',c:'Pak Anto (50 th) tertusuk paku berkarat dan belum pernah imunisasi tetanus. Dokter menyuntikkan imunoglobulin tetanus (TIG) di satu lengan dan vaksin Td di lengan lainnya.',s:[['TIG memberi perlindungan segera, tetapi tidak merangsang pembentukan sel memori.',1],['Vaksin Td merangsang tubuh membentuk antibodi sendiri sehingga perlindungan bertahan lebih lama.',1],['Pemberian TIG bersama vaksin pasti sia-sia karena TIG membuat vaksin sama sekali tidak bekerja.',0]],e:'TIG = kekebalan pasif (tanpa sel memori). TIG dan vaksin diberikan bersamaan di lokasi berbeda sehingga tidak sia-sia.'},
{t:'bs',c:'Dina, kontak serumah pasien TB, menjalani uji tuberkulin (Mantoux). Setelah 48–72 jam muncul indurasi 15 mm di tempat suntikan. Dina tidak batuk maupun demam.',s:[['Indurasi muncul lambat karena reaksi diperantarai sel T dan makrofag.',1],['Reaksi tersebut diperantarai IgE dan histamin seperti alergi makanan laut.',0],['Hasil positif menunjukkan sistem imun pernah mengenali antigen kuman TB, tetapi belum tentu Dina sakit TB aktif.',1]],e:'Uji tuberkulin adalah hipersensitivitas tipe lambat (tipe IV) yang diperantarai sel T, bukan IgE.'},
{t:'bs',c:'Vaksin mRNA COVID-19 berisi mRNA pengkode protein spike yang dibungkus nanopartikel lipid. Setelah disuntikkan, mRNA masuk ke sel otot, lalu sel menghasilkan protein spike.',s:[['mRNA vaksin disisipkan ke DNA inti sel sehingga mengubah genom penerima vaksin.',0],['Protein spike yang dihasilkan dikenali sistem imun dan memicu pembentukan antibodi.',1],['Vaksin ini menimbulkan kekebalan aktif buatan.',1]],e:'mRNA tidak masuk ke inti dan tidak berintegrasi ke DNA; ribosom di sitoplasma menerjemahkannya menjadi protein antigen.'},
{t:'bs',c:'Di sebuah desa dengan cakupan imunisasi campak hanya 60% terjadi KLB campak. Campak sangat menular, sehingga pemutusan penularan memerlukan sekitar 95% penduduk memiliki kekebalan.',s:[['Kekebalan kelompok terbentuk bila sebagian besar penduduk kebal sehingga penularan terputus dan orang rentan ikut terlindungi.',1],['Anak yang tidak diimunisasi pasti terlindungi sepenuhnya karena banyak temannya yang sudah imun.',0],['Cakupan imunisasi yang rendah menurunkan risiko KLB karena virus kehilangan inang.',0]],e:'Kekebalan kelompok butuh cakupan tinggi dan tidak menjamin perlindungan penuh bagi individu tak diimunisasi. Cakupan rendah justru meningkatkan risiko KLB.'},
{t:'bs',c:'Pasien bergolongan darah O menerima transfusi darah golongan A karena salah catat. Beberapa menit kemudian ia menggigil, nyeri punggung, dan urinenya gelap (hemoglobinuria).',s:[['Orang bergolongan darah O dapat menerima darah dari semua golongan karena tidak memiliki antibodi.',0],['Antibodi anti-A dan anti-B baru terbentuk setelah seseorang pernah menerima transfusi.',0],['Antibodi anti-A pasien mengikat antigen A pada eritrosit donor sehingga terjadi aglutinasi dan hemolisis.',1]],e:'Antibodi anti-A dan anti-B terbentuk alami. Golongan O memiliki keduanya sehingga hanya aman menerima darah O.'}
];
const $=document.getElementById('app'),L='ABCDE';let me={n:'',k:''},A=Q.map(q=>q.t=='pg'?null:q.t=='mc'?[]:[null,null,null]);
const sec=i=>i<10?'A':i<15?'B':'C';
function sc(i){const q=Q[i],a=A[i];
if(q.t=='pg')return a===q.a?4:0;
if(q.t=='mc'){const ok=a.filter(x=>q.a.includes(x)).length,bad=a.length-ok;return bad==0&&ok==q.a.length?6:bad==0&&ok>=Math.ceil(q.a.length/2)&&ok>0?3:0}
const n=q.s.filter((s,j)=>a[j]===!!s[1]).length;return n==3?6:n==2?3:0}
function mx(i){return Q[i].t=='pg'?4:6}
function start(){$.innerHTML=`<div class="c"><h1>Ulangan Harian Biologi</h1><p class="mu">Sistem Imun · Format TKA · 20 soal · Bagian A: pilihan ganda, Bagian B: pilihan ganda kompleks, Bagian C: benar–salah studi kasus.</p><label>Nama lengkap</label><input type="text" id="n" autocomplete="name"><label>Kelas</label><input type="text" id="k" placeholder="contoh: XI IPA 1"><button id="go">Mulai Mengerjakan</button><p class="mu" id="er" style="color:var(--no)"></p></div>`;
document.getElementById('go').onclick=()=>{const n=document.getElementById('n').value.trim(),k=document.getElementById('k').value.trim();if(!n||!k){document.getElementById('er').textContent='Isi nama dan kelas terlebih dahulu.';return}me={n,k};quiz()}}
function done(i){const a=A[i];return Q[i].t=='pg'?a!==null:Q[i].t=='mc'?a.length>0:a.every(x=>x!==null)}
function quiz(){const heads={0:'Bagian A. Pilih satu jawaban yang paling tepat.',10:'Bagian B. Pilih semua jawaban yang benar.',15:'Bagian C. Tentukan setiap pernyataan Benar atau Salah.'};
$.innerHTML=`<div class="bar"><div class="mu"><b>${me.n}</b> · ${me.k} · <span id="pc"></span></div><div class="pb"><i id="pi"></i></div></div>`+Q.map((q,i)=>(heads[i]?`<h2>${heads[i]}</h2>`:'')+`<div class="c"><span class="tag">Soal ${i+1}</span><div>${q.c}</div>`+(q.q?`<p><b>${q.q}</b></p>`:'<p class="mu">Tentukan Benar atau Salah:</p>')+(q.t=='bs'?`<div class="tw"><table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>${q.s.map((s,j)=>`<tr><td>${s[0]}</td><td><input type="radio" name="q${i}_${j}" data-i="${i}" data-j="${j}" value="1"></td><td><input type="radio" name="q${i}_${j}" data-i="${i}" data-j="${j}" value="0"></td></tr>`).join('')}</table></div>`:q.o.map((o,j)=>`<label class="o"><input type="${q.t=='pg'?'radio':'checkbox'}" name="q${i}" data-i="${i}" data-j="${j}"><span>${L[j]}. ${o}</span></label>`).join(''))+'</div>').join('')+`<button id="sub">Kumpulkan Jawaban</button><p class="mu" id="er" style="color:var(--no)"></p>`;
$.querySelectorAll('input').forEach(el=>el.onchange=()=>{const i=+el.dataset.i,j=+el.dataset.j,q=Q[i];
if(q.t=='pg')A[i]=j;else if(q.t=='mc'){const s=new Set(A[i]);el.checked?s.add(j):s.delete(j);A[i]=[...s]}else A[i][j]=el.value=='1';upd()});
document.getElementById('sub').onclick=()=>{const u=Q.map((_,i)=>i).filter(i=>!done(i));if(u.length&&!confirm(`Ada ${u.length} soal belum dijawab sepenuhnya (No. ${u.map(x=>x+1).join(', ')}). Tetap kumpulkan?`))return;res()};upd();window.scrollTo(0,0)}
function upd(){const d=Q.filter((_,i)=>done(i)).length;document.getElementById('pc').textContent=d+'/20 terjawab';document.getElementById('pi').style.width=d*5+'%'}
function res(){const s=Q.map((_,i)=>sc(i)),tot=s.reduce((a,b)=>a+b,0),g=x=>[0,1,2].map(r=>[0,10,15,20].slice(r,r+2)).slice(0,3)[0];
const part=(a,b)=>s.slice(a,b).reduce((x,y)=>x+y,0),pm=[[0,10,40,'A. Pilihan ganda'],[10,15,30,'B. PG kompleks'],[15,20,30,'C. Benar–salah']];

const weak=pm.filter(p=>part(p[0],p[1])<p[2]*.6).map(p=>p[3]);
$.innerHTML=`<div class="c" style="text-align:center"><p class="mu">${me.n} · ${me.k}</p><div class="big">${tot}</div><p class="mu">dari 100</p><h2>${fb[0]}</h2><p>${fb[1]}</p>${weak.length?`<p class="mu">Perlu diperkuat: <b>${weak.join('; ')}</b></p>`:''}</div><div class="c"><h2>Rincian Skor</h2>${T(['Bagian','Skor'],...pm.map(p=>[p[3],part(p[0],p[1])+' / '+p[2]]))}<p class="mu">Soal salah: ${Q.map((_,i)=>i).filter(i=>s[i]<mx(i)).map(i=>i+1).join(', ')||'tidak ada'}</p></div><div class="r np"><button id="rv">Lihat Pembahasan</button><button class="s" id="pr">Cetak / Simpan PDF</button></div>`;
document.getElementById('rv').onclick=review;document.getElementById('pr').onclick=()=>print();window.scrollTo(0,0)}
function review(){const h=`<div class="c"><h1>Pembahasan</h1><p class="mu">${me.n} · ${me.k}. Hijau = kunci jawaban, merah = jawabanmu yang kurang tepat.</p></div>`;
$.innerHTML=h+Q.map((q,i)=>{const s=sc(i),a=A[i];let b;
if(q.t=='bs')b=`<div class="tw"><table><tr><th>Pernyataan</th><th>Kunci</th><th>Jawabanmu</th></tr>${q.s.map((x,j)=>`<tr><td>${x[0]}</td><td>${x[1]?'Benar':'Salah'}</td><td style="color:var(--${a[j]===!!x[1]?'ok':'no'})">${a[j]===null?'Kosong':a[j]?'Benar':'Salah'}</td></tr>`).join('')}</table></div>`;
else b=q.o.map((o,j)=>{const key=q.t=='pg'?q.a==j:q.a.includes(j),pick=q.t=='pg'?a===j:a.includes(j);return`<div class="o ${key?'k':pick?'x':''}"><span>${L[j]}. ${o}${pick?' <b>(jawabanmu)</b>':''}${key?' ✓':''}</span></div>`}).join('');
return`<div class="c"><span class="tag">Soal ${i+1} · skor ${s}/${mx(i)}</span><div>${q.c}</div>${q.q?`<p><b>${q.q}</b></p>`:''}${b}<div class="ex"><b>Pembahasan:</b> ${q.e}</div></div>`}).join('')+`<div class="r np"><button class="s" id="bk">Kembali ke Nilai</button><button class="s" id="pr">Cetak / Simpan PDF</button></div>`;

start();
